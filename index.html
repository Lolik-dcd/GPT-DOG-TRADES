<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>GPT DOG TRADE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h1>🚀 GPT DOG TRADE</h1>
  <button onclick="openRef()">📌 Перейти по реф. ссылке</button>
  <button onclick="sendID()">🆔 Отправить ID</button>
  <button onclick="sendDeposit()">💵 Я пополнил депозит</button>

  <hr>
  <h2>⚡ Сигналы</h2>
  <label>Валютная пара:</label>
  <select id="pair">
    <option>EUR/USD</option>
    <option>GBP/USD</option>
    <option>USD/JPY</option>
    <option>AUD/USD</option>
  </select>

  <label>Таймфрейм:</label>
  <select id="tf">
    <option>1m</option>
    <option>5m</option>
    <option>15m</option>
  </select>

  <button onclick="sendSignal()">📊 Получить анализ</button>
  <button onclick="reset()">🔄 Сбросить сигнал</button>
  <button onclick="home()">🏠 На главную</button>

  <script src="script.js"></script>
</body>
</html>
